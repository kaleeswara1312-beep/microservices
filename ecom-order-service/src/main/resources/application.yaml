
spring:
  application:
    name: ecom-order-service

  cloud:
    openfeign:
      micrometer:
        enabled: true
      client:
        default-to-properties: true
        config:
          ecom-inventory-service:
            connectTimeout: 3000
            readTimeout: 20000
            loggerLevel: full

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8003

otel:
  file_format: "1.0"

  resource:
    attributes:
      - name: service.name
        value: ecom-order-service

  propagator:
    composite:
      - tracecontext:
      - baggage:

  instrumentation:
    micrometer:
      enabled: true

  tracer_provider:
    processors:
      - batch:
          exporter:
            otlp_http:
              endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit: DEBUG
