spring:
  application:
    name: ecom-order-service

  cloud:
    openfeign:
      client:
        default-to-properties: true
        config:
          inventory-service:
            connectTimeout: 3000
            readTimeout: 20000
            loggerLevel: full

server:
  port: 8003

logging:
  level:
    org.example.ecomorderservice.config: DEBUG
    org.example.ecomorderservice: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

