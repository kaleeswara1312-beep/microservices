
spring:
  application:
    name: ecom-order-service

  cloud:
    openfeign:
      micrometer:
        enabled: true
      client:
        default-to-properties: true
        config:
          ecom-inventory-service:
            connectTimeout: 3000
            readTimeout: 20000
            loggerLevel: full

server:
  port: 8003

otel:
  file_format: "1.0"

  resource:
    attributes:
      - name: service.name
        value: ecom-order-service

  propagator:
    composite:
      - tracecontext:
      - baggage:

  instrumentation:
    micrometer:
      enabled: true

  tracer_provider:
    processors:
      - batch:
          exporter:
            otlp_http:
              endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
