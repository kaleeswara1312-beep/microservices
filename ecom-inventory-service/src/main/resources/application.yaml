spring:
  application:
    name: ecom-inventory-service

server:
  port: 8001

otel:
  file_format: "1.0"

  resource:
    attributes:
      - name: service.name
        value: ecom-inventory-service

  propagator:
    composite:
      - tracecontext:
      - baggage:

  tracer_provider:
    processors:
      - batch:
          exporter:
            otlp_http:
              endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}