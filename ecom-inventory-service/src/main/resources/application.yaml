spring:
  application:
    name: ecom-inventory-service

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: org.example.ecominventoryservice.service.OrderEvent
        spring.json.trusted.packages: org.example.ecominventoryservice.service
        spring.json.use.type.headers: false


server:
  port: ${SERVER_PORT:8001}

otel:
  file_format: "1.0"

  resource:
    attributes:
      - name: service.name
        value: ecom-inventory-service

  propagator:
    composite:
      - tracecontext:
      - baggage:

  tracer_provider:
    processors:
      - batch:
          exporter:
            otlp_http:
              endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}