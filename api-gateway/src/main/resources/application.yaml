
server:
  port: 9001

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ecom-order-service
              predicates:
                - Path=/orders/**

            - id: inventory-service
              uri: lb://ecom-inventory-service
              predicates:
                - Path=/inventory/**